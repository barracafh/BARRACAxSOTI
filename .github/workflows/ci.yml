name: Comprobaciones
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilar la plantilla independiente
        working-directory: plantilla
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun install --frozen-lockfile && bun run build
