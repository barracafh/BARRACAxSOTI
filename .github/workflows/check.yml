name: Comprobaciones

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: comprobaciones-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, pruebas y binarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:flujo
      - run: bun run test:live
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build:bin:host
      - name: Comprobar los binarios autónomos
        run: |
          export HACKNIGHT_BIN="$PWD/cli/dist/hacknight"
          export HACKNIGHT_SERVER_BIN="$PWD/server/dist/hacknight-server"
          bun run test:flujo
          bun run test:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-navegador
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
