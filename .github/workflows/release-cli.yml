name: Release del CLI
# Comprueba y compila un tag cli-v*. La publicación va al registro público con
# infra/cli/publicar.ts, porque el CLI y el instalador descargan de allí.
on:
  push:
    tags:
      - "cli-v*"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Comprobar versión del tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/check-release.ts
      - run: bun run check
      - name: Compilar los cinco binarios
        run: bash apps/cli/scripts/build-all.sh
