name: Release del CLI
on:
  push:
    tags:
      - "cli-v*"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-linux-x64
          - bun-linux-arm64
          - bun-darwin-x64
          - bun-darwin-arm64
          - bun-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Comprobar versión del tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/check-release.ts
      - run: bun run check
      - name: Compilar binario
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash apps/cli/scripts/build-all.sh --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: apps/cli/dist/hacknight-*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generar hashes y publicar
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum hacknight-* > SHA256SUMS
          gh release create "$RELEASE_TAG" hacknight-* SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes "Binarios de hacknight con sumas SHA256."
